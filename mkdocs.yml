          - Ban: RESTAPI/Endpoints/ban.md
          - Banip: RESTAPI/Endpoints/banip.md
          - Banlist: RESTAPI/Endpoints/banlist.md
          - Broadcast: RESTAPI/Endpoints/broadcast.md
          - Deletebase: RESTAPI/Endpoints/deletebase.md
          - Forgettech: RESTAPI/Endpoints/forgettech.md
          - Give Items: RESTAPI/Endpoints/give-items.md
          - Give Paleggs: RESTAPI/Endpoints/give-paleggs.md
          - Give Pals: RESTAPI/Endpoints/give-pals.md
          - Give Paltemplate: RESTAPI/Endpoints/give-paltemplate.md
          - Give Progression: RESTAPI/Endpoints/give-progression.md
          - Give_Deprecated: RESTAPI/Endpoints/give_deprecated.md
          - Guild: RESTAPI/Endpoints/guild.md
          - Guilds: RESTAPI/Endpoints/guilds.md
          - Items: RESTAPI/Endpoints/items.md
          - Kick: RESTAPI/Endpoints/kick.md
          - Learntech: RESTAPI/Endpoints/learntech.md
          - Pals: RESTAPI/Endpoints/pals.md
          - Player: RESTAPI/Endpoints/player.md
          - Players: RESTAPI/Endpoints/players.md
          - Progression: RESTAPI/Endpoints/progression.md
          - Reload Config: RESTAPI/Endpoints/reload-config.md
