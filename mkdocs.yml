  - Partnerships: Partnerships.md
extra_css:
  - stylesheets/extra.css

theme:
  name: material
  custom_dir: overrides
  font:
    text: Nunito
    code: JetBrains Mono
  logo: assets/LogoWiki.png
  favicon: assets/LogoWiki.png
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/pencil-16
      tip: octicons/light-bulb-16
      warning: octicons/alert-16
      danger: octicons/flame-16
      info: octicons/info-16
      success: octicons/check-circle-16
      question: octicons/question-16
      example: octicons/beaker-16
      quote: octicons/quote-16
  features:
    - navigation.indexes
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - abbr
  - admonition
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
        - locale: de
          name: Deutsch (German)
        - locale: zh
          name: 简体中文 (Chinese)

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ultimeit/PalDefender
      name: PalDefender on GitHub
